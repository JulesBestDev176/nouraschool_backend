# CI : lint → test → coverage → build → scan image
# À activer : branch protection sur main et develop (voir docs/BRANCH_PROTECTION.md)
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Lint & Test & Coverage
        run: mvn verify -B -Dquarkus.test.disable-continuous-testing=true
        env:
          MAVEN_OPTS: -Xmx1024m

      - name: Build package
        run: mvn package -B -DskipTests -Dquarkus.package.type=jar

      - name: Build Docker image
        run: |
          docker build -f docker/Dockerfile -t noura-school-backend:${{ github.sha }} .
        env:
          DOCKER_BUILDKIT: 1

      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "noura-school-backend:${{ github.sha }}"
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"

      - name: Upload Trivy scan (Security tab)
        if: success()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "trivy-results.sarif"
