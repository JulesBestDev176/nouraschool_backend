# CI/CD : build → scan image → deploy develop
# Tests skippés (dépendances test manquantes à corriger séparément)
name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Build package
        run: mvn package -B -Dmaven.test.skip=true
        env:
          MAVEN_OPTS: -Xmx1024m

      - name: Build Docker image
        run: |
          docker build -f docker/Dockerfile -t noura-school-backend:${{ github.sha }} .
        env:
          DOCKER_BUILDKIT: 1

      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "noura-school-backend:${{ github.sha }}"
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"

      - name: Upload Trivy scan (Security tab)
        if: success()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "trivy-results.sarif"

  deploy-develop:
    name: Deploy develop to Coolify
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    steps:
      - name: Trigger Coolify deployment
        run: |
          curl --fail --request POST "${{ secrets.COOLIFY_WEBHOOK }}" \
            --header "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" \
            --header "Content-Type: application/json"
