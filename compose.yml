services:
  postgres:
    image: postgres:16-alpine
    container_name: noura-school-db
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-noura_school}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-noura_school}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: noura-school-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: noura-school-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Console web
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: noura-school-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin};
        mc mb --ignore-existing local/${S3_BUCKET:-noura-school-files};
        mc anonymous set download local/${S3_BUCKET:-noura-school-files}/tenants;
        exit 0;
      "

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: noura-school-backend
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-noura_school}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_ISSUER: ${JWT_ISSUER:-https://noura-school.com}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-noura-school-api}
      QUARKUS_DEV_SERVICES_ENABLED: "false"
      # MinIO (S3-compatible)
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      AWS_REGION: us-east-1
      S3_ENDPOINT_OVERRIDE: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-noura-school-files}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-http://localhost:9000/${S3_BUCKET:-noura-school-files}}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  backend-dev:
    image: eclipse-temurin:21-jdk-alpine
    container_name: noura-school-backend-dev
    profiles: ["dev"]
    working_dir: /workspace
    command:
      - sh
      - -c
      - >
        sed -i 's/\x0D$//' mvnw &&
        chmod +x mvnw &&
        ./mvnw quarkus:dev
        -Dquarkus.http.host=0.0.0.0
        -Dquarkus.test.continuous-testing=disabled
        -Dmaven.test.skip=true
    ports:
      - "8080:8080"
      - "5005:5005"
    environment:
      QUARKUS_PROFILE: dev
      QUARKUS_DEV_SERVICES_ENABLED: "false"
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-noura_school}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_ISSUER: ${JWT_ISSUER:-https://noura-school.com}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-noura-school-api}
      # MinIO (S3-compatible)
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      AWS_REGION: us-east-1
      S3_ENDPOINT_OVERRIDE: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-noura-school-files}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-http://localhost:9000/${S3_BUCKET:-noura-school-files}}
    volumes:
      - ..:/workspace
      - m2_cache:/root/.m2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  minio_data:
  m2_cache:
