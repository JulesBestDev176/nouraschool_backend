# Profil prod — déploiement (FOLDER 13 TACHES_CLICKUP)
# Secrets via env : DB_USERNAME, DB_PASSWORD, DB_HOST, DB_PORT, DB_NAME
# REDIS_HOST, REDIS_PORT, REDIS_PASSWORD
# JWT_ISSUER, JWT_AUDIENCE, JWT_ACCESS_TOKEN_LIFESPAN
# AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, S3_BUCKET
# ELASTIC_* si logging Elastic activé

quarkus:
  devservices:
    enabled: false
  datasource:
    devservices:
      enabled: false
  log:
    level: INFO
    category:
      "com.nouraschool":
        level: INFO
    console:
      json: true
  swagger-ui:
    always-include: false
  smallrye-openapi:
    path: /q/openapi
    ui-always-include: false
  hibernate-orm:
    schema-management:
      strategy: ${HIBERNATE_SCHEMA_STRATEGY:update}
  http:
    port: 8080

app:
  security:
    jwt-validation-enabled: true
  logging:
    elastic:
      enabled: ${ELASTIC_LOGGING_ENABLED:false}
